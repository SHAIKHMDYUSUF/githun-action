name: Python-CI
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code1
              uses: actions/checkout@v6
            - name: Setup up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
            - name: show python version
              run : python --version
            - name: run tests
              run: python -m unittest discover -s . -p "test_*.py"
